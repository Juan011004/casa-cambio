# TRM en hora: no depende del Cron de Vercel (Hobby = 1 ejecución/día).
# Requisitos en GitHub → Settings → Secrets and variables → Actions:
#   TRM_UPDATE_URL  → ej. https://tu-proyecto.vercel.app/api/trm-update
#   CRON_SECRET     → el mismo valor que en Vercel (env CRON_SECRET)
#
# Límite: GitHub Actions en repos públicos tiene minutos generosos; en privados revisa la cuota.

name: Actualizar TRM cada hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar-trm:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de TRM
        env:
          TRM_UPDATE_URL: ${{ secrets.TRM_UPDATE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TRM_UPDATE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Falta TRM_UPDATE_URL o CRON_SECRET en los secrets del repositorio."
            exit 1
          fi
          curl -fsS -X GET "$TRM_UPDATE_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
